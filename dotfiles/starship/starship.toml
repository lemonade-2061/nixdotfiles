"$schema" = 'https://starship.rs/config-schema.json'

# プロンプト前の空行なし
add_newline = false

# 1行目: ユーザー/パス + git ── 罫線で右端へ ── 言語・所要時間・時計
# 2行目: ❯ (直前コマンドの成否で色が変わる)
format = """
[╭─ ](fg:muted)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
[ ](fg:muted)\
$fill\
$nix_shell\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$conda\
$python\
$cmd_duration\
$time\
[─╮](fg:muted)\
$line_break\
[╰─](fg:muted)$character"""

palette = "slate-blue"

# kitty / quickshell バーと同じ Slate Blue (Nord 風グレーブルー) 系統
[palettes.slate-blue]
line = '#6f7d96' # 右寄せの罫線
muted = '#8a94a8' # 枠線・区切りアイコン (背景 #20242e 上でも読める明るさ)
text = '#e5e9f0'
blue = '#88c0d0'
frost = '#c8d6ee' # ユーザー名・時刻
nixblue = '#8cc8f0' # メインアクセント (バーより少し明るく)
red = '#e06c75'
green = '#b5d98f'
yellow = '#f0d58c'
teal = '#93d6d0'

[fill]
symbol = "─"
style = "fg:line"

# 左端の Nix ロゴ
[os]
disabled = false
format = "[$symbol]($style)"
style = "fg:nixblue"

[os.symbols]
NixOS = " "
Arch = " "
Linux = " "

[username]
disabled = false
show_always = true
format = "[$user]($style)"
style_user = "fg:frost"
style_root = "fg:red bold"

# SSH 先でのみホスト名を出す
[hostname]
ssh_only = true
format = "[@$hostname]($style)"
style = "fg:teal"

[directory]
format = "[  ](fg:blue)[$path]($style)[$read_only]($read_only_style)"
style = "fg:nixblue bold"
read_only = " "
read_only_style = "fg:red"
# 折り返し（プロンプト複製の原因）を防ぐため表示は末尾2階層まで
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

# git はリポジトリ内でだけ現れる
[git_branch]
format = "[  ](fg:muted)[$symbol $branch]($style)"
style = "fg:teal"
# 長いブランチ名で折り返さないよう20文字で切る
truncation_length = 20
symbol = ""

[git_status]
disabled = false
style = "fg:yellow"
format = '( [$all_status$ahead_behind]($style))'
up_to_date = '[✓ ](fg:green)'
untracked = '[?$count ](fg:yellow)'
stashed = '[\$ ](fg:frost)'
modified = '[!$count ](fg:yellow)'
renamed = '[»$count ](fg:frost)'
deleted = '[✘$count ](fg:red)'
staged = '[+$count ](fg:green)'
ahead = '[⇡$count ](fg:teal)'
behind = '[⇣$count ](fg:red)'
diverged = '[⇡$ahead_count⇣$behind_count ](fg:red)'

# ---- 右側 ----

[nix_shell]
format = "[ $symbol$name]($style)"
symbol = " "
style = "fg:teal"
heuristic = false

[cmd_duration]
min_time = 2000
format = "[   $duration]($style)"
style = "fg:yellow"

# 右端の時計
[time]
disabled = false
format = "[  ](fg:muted)[$time \U000f0954]($style) "
style = "fg:frost"
time_format = "%I:%M%P"

[character]
success_symbol = "[❯](bold fg:nixblue)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

# Languages

[c]
style = "fg:blue"
format = "[  $symbol$version]($style)"
disabled = false
symbol = " "

[elixir]
style = "fg:blue"
format = "[  $symbol$version]($style)"
disabled = false
symbol = " "

[elm]
style = "fg:blue"
format = "[  $symbol$version]($style)"
disabled = false
symbol = " "

[golang]
style = "fg:blue"
format = "[  $symbol$version]($style)"
disabled = false
symbol = " "

