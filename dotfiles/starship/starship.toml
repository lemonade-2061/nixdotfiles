"$schema" = 'https://starship.rs/config-schema.json'

# プロンプト前の空行なし
add_newline = false

format = """
[╭─](fg:muted) \
$username\
$directory\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$conda\
$python\
$time\n\
[╰─](fg:muted)[❯](fg:nixblue) \
"""

palette = "slate-blue"

# kitty / quickshell バーと同じ Slate Blue (Nord 風グレーブルー) 系統
[palettes.slate-blue]
surface = '#2e3440' # カプセル背景 (ターミナル背景 #20242e より一段明るい面)
muted = '#6c7689'
text = '#d2d9e8'
blue = '#81a1c1'
frost = '#a3b8d8'
steel = '#5e81ac'
nixblue = '#7ebae4' # バーのメインアクセント
coral = '#e48b7e'
red = '#bf616a'
green = '#a3be8c'
yellow = '#ebcb8b'
teal = '#8fbcbb'

[directory]
format = "[](fg:surface)[ $path ]($style)[](fg:surface) "
style = "bg:surface fg:nixblue"
# 折り返し（プロンプト複製の原因）を防ぐため表示は末尾2階層まで
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[git_branch]
format = "[](fg:surface)[ $symbol $branch ]($style)[](fg:surface) "
style = "bg:surface fg:teal"
# 長いブランチ名で折り返さないよう20文字で切る
truncation_length = 20
symbol = ""

[git_status]
disabled = false
style = "bg:surface fg:coral"
format = '[](fg:surface)([$all_status$ahead_behind]($style))[](fg:surface) '
up_to_date = '[ ✓ ](bg:surface fg:green)'
untracked = '[?\($count\)](bg:surface fg:yellow)'
stashed = '[\$](bg:surface fg:frost)'
modified = '[!\($count\)](bg:surface fg:yellow)'
renamed = '[»\($count\)](bg:surface fg:frost)'
deleted = '[✘\($count\)](bg:surface fg:red)'
staged = '[++\($count\)](bg:surface fg:green)'
ahead = '[⇡\(${count}\)](bg:surface fg:teal)'
diverged = '⇕[\[](bg:surface fg:frost)[⇡\(${ahead_count}\)](bg:surface fg:teal)[⇣\(${behind_count}\)](bg:surface fg:coral)[\]](bg:surface fg:frost)'
behind = '[⇣\(${count}\)](bg:surface fg:coral)'

[time]
disabled = false
format = " [](fg:surface)[ $time  ]($style)[](fg:surface)"
style = "bg:surface fg:steel"
time_format = "%I:%M%P"
use_12hr = true

[username]
disabled = false
format = "[](fg:surface)[ ](bg:surface fg:nixblue)[$user ]($style)[](fg:surface) "
show_always = true
style_root = "bg:surface fg:red"
style_user = "bg:surface fg:frost"

# Languages

